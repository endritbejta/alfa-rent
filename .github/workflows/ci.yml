name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v7
        with:
          # The migration-safety check diffs against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Blocking. Fails on destructive SQL without a
      # `-- migration-safety: allow <reason>` marker, and on any migration
      # that removes one of the four objects schema.prisma does not model.
      - name: Migration safety
        run: npm run check:migrations
        env:
          # On a push to main, check what the push added; on a PR, the
          # script uses origin/$GITHUB_BASE_REF.
          MIGRATION_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - run: npm run build

  # Report-only for now: the step may fail without failing the job, and the
  # result is written to the run summary and as a warning annotation. To make
  # it blocking, delete `continue-on-error` (and the summary step's warning),
  # then mark "Dependency audit" as a required check in branch protection.
  audit:
    name: Dependency audit (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: npm audit --omit=dev --audit-level=high
        id: audit
        continue-on-error: true
        # Reads package-lock.json; no install needed.
        run: npm audit --omit=dev --audit-level=high
      - name: Summarise
        if: always()
        env:
          OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo "## Dependency audit (report-only)"
            echo
            if [ "$OUTCOME" = "success" ]; then
              echo "No high or critical advisories in production dependencies."
            else
              echo "High or critical advisories found. This job does not block merges yet."
              echo
              echo '```'
              npm audit --omit=dev --audit-level=high || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != "success" ]; then
            echo "::warning title=npm audit (report-only)::High or critical advisories in production dependencies; see the run summary."
          fi

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npx prisma migrate deploy
      - run: npm run build
      # Starts `next start` itself (playwright.config.ts) with a throwaway
      # AUTH_SECRET and every third-party credential blank.
      - run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
